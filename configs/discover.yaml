# Paths are resolved relative to the working directory. Run from the project root.
data:
  lowres_lcc_root: /gpfsm/dnb10/projects/p311/ML_downscaling/data/lowres_lcc_1hr
  native_root: /gpfsm/dnb06/projects/p174/f5295_fp/diag
  highres_root: /gpfsm/dnb08/projects/p38/HWT/CONUS02KM/Feature-c2160_L137/holding
  prepared: data/paired_hourly_prectot
  start: '2025-01-01T00:30:00'
  end: '2025-12-31T23:30:00'
  # Half-open time ranges; 48-hour gaps reduce leakage across weather events.
  splits:
    train: ['2025-01-01', '2025-09-01']
    val: ['2025-09-03', '2025-10-16']
    test: ['2025-10-18', '2026-01-01']
  # Minimal nonredundant dynamic set. T2M, PS, and wind speed are already
  # supplied as coarse baseline channels; U/V retain direction and TQV adds
  # column moisture information for precipitation structure.
  predictors: [PRECTOT, U10M, V10M, TQV]
  # Same :30 HWT surface file/variable as plot_diagnostics.py; rate * 3600 -> mm/h.
  precip_source: hwt_30mn_slv_LCC.PRECTOT
  # States are the :30 HR snapshot, not hourly mean states. Explicit approximation.
  state_alignment: midpoint_snapshot
  strict_missing: true
  conserve_training_precip: true
  stats_stride: 8
  precip_log_scale: 1.0  # mm/hour
  wind_log_scale: 5.0   # m/s
patch:
  size: 128
  halo: 16  # network sees 160x160, loss uses central 128x128
  stride: 96
  samples_per_epoch: 8192
model:
  base_channels: 48
  channel_mult: [1, 2, 4, 4]
  time_dim: 128
  activation_checkpointing: true
train:
  device: auto
  seed: 2025
  epochs: 100
  batch_size: 2
  accumulate: 8
  workers: 2
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_ratio: 0.05
  grad_clip: 1.0
  precision: bf16
  ema_decay: 0.999
  val_batches: 32
  channel_weights: [1.0, 1.0, 1.0, 1.0]
  output: runs/cfm128_prectot
inference:
  members: 8
  steps: 24  # Heun, 48 network evaluations
  seed: 317
  dry_threshold: 0.01  # applied before final conservation projection
  output: runs/cfm128_prectot/predictions
