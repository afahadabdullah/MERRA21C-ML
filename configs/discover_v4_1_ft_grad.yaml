# v4.1 gradient fine-tune: start from the trained v4.1 run (weights, EMA, frozen
# regression, calibration) and continue with
#   loss = flow MSE + gradient_weight * MSE of the velocity error's gradient,
# with part of the flow times shifted toward the data end, where fronts form.
# Both terms keep the conditional-mean optimum (no smoothing bias); they reweight
# training toward sharp, small-scale errors. data/patch/model/conditioning must
# stay identical to the source run. Launch:
#   CONFIG=configs/discover_v4_1_ft_grad.yaml sbatch scripts/slurm_train_v4_1.sh
version: v4.1
conditioning:
  checkpoint: runs/merraflow_annual_v2/regression_v2/best_v2.pt
data:
  prepared: data/paired_hourly_annual_v2
  hourly_targets: data/hwt_hourly_mean_v3_precip
  target_kind: hourly_mean_trapezoid
  representation: sqrt1p
  rain_scale_mm_h: 1.0
  history_hours: [-1, 0]
  humidity_targets: data/hwt_q2m_v4
  humidity_target_variable: SPFH_2M
  humidity_scale_kg_kg: 0.001
packed:
  root: data/packed_v4_1   # ~139 MB per packed hour; see `cli_v4_1 plan-packed`
  splits: [train, val]
  tile: 32                 # native-resolution tile edge (pixels)
  context_tile: 32         # pooled-context tile edge (pooled pixels)
patch:
  size: 128
  halo: 32
  stride: 96
  samples_per_epoch: 32768
  context_scale: 3
  context_size: 96
  sampling_stride: 24      # must be a multiple of the pooling factor 576/96 = 6
  detail_fraction: 0.5
  proposal: coarse
  loss_on_halo: true
model:
  base_channels: 64
  channel_mult: [1, 2, 3, 4]
  time_dim: 256
  activation_checkpointing: false
  blocks_per_level: 2
  attention_heads: 8
train:
  device: auto
  seed: 2026
  epochs: 40               # fine-tune epochs (512 optimizer steps each)
  batch_size: 16           # v4: 8 x accumulate 2; same effective batch 64 on 4 GPUs
  accumulate: 1
  workers: 12              # per rank; the job gets 12 cores per GPU
  val_workers: 4
  persistent_workers: true
  prefetch_factor: 6
  fd_cache_size: 64
  learning_rate: 0.00005    # 1/4 of the original peak: refine, don't retrain
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_ratio: 0.05
  grad_clip: 1.0
  precision: bf16
  ema_decay: 0.9995
  time_limit_hours: 11.0
  calibration_batches: 64  # 64 x 16 = the same 1024 calibration patches as v4
  channel_weights: [1.0, 2.0, 1.0, 1.0, 1.0, 1.0]
  # Validation + diagnostic plots + a kept checkpoint fire together on this
  # cadence: every validation_interval epochs, switching to the finer
  # validation_interval_late after schedule_switch_epoch. Here: every 5 through
  # epoch 20, then every 2. Kept checkpoints are named
  # checkpoints/epoch_NNNN_crps<value>_v4_1.pt. Cadence is resume-safe: change
  # it on a continuation without breaking exact resume.
  validation_interval: 2
  validation_patches: 256
  validation_members: 8
  validation_steps: 24
  validation_plot_samples: 4   # fixed rainy validation patches, same every epoch
  output: runs/merraflow_v4_1_ft_grad
  finetune:
    init: runs/merraflow_v4_1/last_v4_1.pt   # or a kept checkpoint
    gradient_weight: 1.0       # 0 = plain v4 loss
    late_time_fraction: 0.5    # share of samples with times shifted toward the data end
    late_time_shift: 3.0       # t' = s t / (1 + (s-1) t); median of shifted times ~0.75
inference:
  steps: 32
  members: 16
  seed: 317
  output: runs/merraflow_v4_1_ft_grad/predictions
