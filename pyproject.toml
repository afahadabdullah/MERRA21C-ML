[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merraflow"
version = "0.1.0"
description = "Patch-based conditional flow matching for GEOS-FP to HWT LCC downscaling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "xarray>=2023.1", "h5netcdf>=1.3", "h5py>=3.8", "PyYAML>=6", "torch>=2.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]
workflow = ["cartopy>=0.22", "cfgrib>=0.9.10", "eccodes>=1.7"]

[project.scripts]
merraflow = "merraflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
